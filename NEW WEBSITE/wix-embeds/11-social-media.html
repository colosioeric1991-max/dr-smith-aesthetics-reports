<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
<style>
  :root {
    --teal:       #0D3B4F;
    --teal-mid:   #1A5068;
    --gold:       #C9A96E;
    --cream:      #F5F1EB;
    --warm-white: #FDFAF6;
    --muted:      #6B7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); }

  .social-section {
    background: var(--cream);
    padding: 6rem 5.5rem;
    text-align: center;
    position: relative;
  }
  .social-section::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(201,169,110,0.4), transparent);
  }

  .eyebrow {
    font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--gold);
    display: inline-flex; align-items: center; gap: 0.7rem;
    margin-bottom: 0.9rem;
  }
  .eyebrow::before { content: ''; width: 26px; height: 1px; background: var(--gold); }
  .eyebrow::after  { content: ''; width: 26px; height: 1px; background: var(--gold); }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.2rem, 3.2vw, 3.4rem);
    font-weight: 300; line-height: 1.1;
    letter-spacing: -0.02em; color: var(--teal);
    margin-bottom: 3rem;
  }
  .section-title em { font-style: italic; font-weight: 400; }

  .social-cards {
    display: flex; justify-content: center; gap: 1.5rem;
    flex-wrap: wrap;
  }

  .social-card {
    display: flex; flex-direction: column; align-items: center;
    gap: 0.6rem;
    background: var(--warm-white);
    border: 1px solid rgba(13,59,79,0.1);
    border-radius: 4px;
    padding: 2.5rem 3rem;
    text-decoration: none;
    min-width: 200px;
    transition: background 0.3s ease, border-color 0.3s ease, transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }
  .social-card:hover {
    background: var(--teal);
    border-color: var(--teal);
    transform: translateY(-3px);
  }
  .social-card:hover .social-card-icon { color: var(--gold); }
  .social-card:hover .social-card-platform { color: var(--warm-white); }
  .social-card:hover .social-card-handle { color: rgba(248,244,238,0.65); }

  .social-card-icon {
    color: var(--teal);
    transition: color 0.3s ease;
  }

  .social-card-platform {
    font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--teal);
    transition: color 0.3s ease;
  }

  .social-card-handle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem; font-style: italic;
    color: var(--muted);
    transition: color 0.3s ease;
  }

  @media (max-width: 700px) {
    .social-section { padding: 3.5rem 1.5rem; }
    .social-cards { gap: 1rem; }
    .social-card { padding: 2rem 2.5rem; min-width: 160px; }
  }
</style>
</head>
<body>
  <section class="social-section">
    <p class="eyebrow">Stay Connected</p>
    <h2 class="section-title">Follow <em>Dr Smith Aesthetics</em></h2>

    <div class="social-cards">

      <!-- Instagram -->
      <a href="https://www.instagram.com/drlsmithaesthetics/" target="_blank" rel="noopener noreferrer" onclick="window.top.open(this.href,'_blank');return false;" class="social-card" aria-label="Instagram">
        <div class="social-card-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
          </svg>
        </div>
        <p class="social-card-platform">Instagram</p>
        <p class="social-card-handle">@drlsmithaesthetics</p>
      </a>

      <!-- TikTok -->
      <a href="https://www.tiktok.com/@drsmithaesthetics" target="_blank" rel="noopener noreferrer" onclick="window.top.open(this.href,'_blank');return false;" class="social-card" aria-label="TikTok">
        <div class="social-card-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/>
          </svg>
        </div>
        <p class="social-card-platform">TikTok</p>
        <p class="social-card-handle">@drsmithaesthetics</p>
      </a>

      <!-- YouTube -->
      <a href="https://www.youtube.com/@drsmithaesthetics" target="_blank" rel="noopener noreferrer" onclick="window.top.open(this.href,'_blank');return false;" class="social-card" aria-label="YouTube">
        <div class="social-card-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/>
            <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/>
          </svg>
        </div>
        <p class="social-card-platform">YouTube</p>
        <p class="social-card-handle">@drsmithaesthetics</p>
      </a>

    </div>
  </section>
</body>
</html>
