<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
<style>
  :root {
    --teal:       #0D3B4F;
    --gold:       #C9A96E;
    --cream:      #F5F1EB;
    --warm-white: #FDFAF6;
    --muted:      #6B7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; overflow-x: hidden; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); }

  .brands {
    background: var(--cream);
    padding: 3.5rem 0;
    position: relative;
    overflow: hidden;
  }
  .brands::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(201,169,110,0.4), transparent);
  }

  .brands-header {
    text-align: center;
    margin-bottom: 2.5rem;
    padding: 0 2rem;
  }
  .eyebrow {
    font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--gold);
    display: flex; align-items: center; justify-content: center; gap: 0.7rem;
    margin-bottom: 0.5rem;
  }
  .eyebrow::before, .eyebrow::after {
    content: ''; width: 26px; height: 1px; background: var(--gold);
  }
  .brands-header p {
    font-size: 0.82rem; font-weight: 300;
    color: var(--muted); line-height: 1.7;
  }

  .brands::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(201,169,110,0.4), transparent);
  }

  .fade-left, .fade-right {
    position: absolute; top: 0; bottom: 0; width: 120px;
    z-index: 2; pointer-events: none;
  }
  .fade-left  { left: 0;  background: linear-gradient(to right, var(--cream), transparent); }
  .fade-right { right: 0; background: linear-gradient(to left,  var(--cream), transparent); }

  .marquee-outer { overflow: hidden; }
  .marquee-track {
    display: flex; align-items: center; gap: 5rem;
    width: max-content;
    animation: marquee-scroll 28s linear infinite;
  }
  .marquee-track:hover { animation-play-state: paused; }

  @keyframes marquee-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  .brand-logo {
    height: 36px; width: auto;
    object-fit: contain;
    filter: grayscale(100%) opacity(0.5);
    transition: filter 0.3s ease;
    flex-shrink: 0;
  }
  .brand-logo:hover { filter: grayscale(0%) opacity(1); }
  .brand-logo-invert { filter: invert(1) grayscale(100%) opacity(0.5); }
  .brand-logo-invert:hover { filter: invert(1) grayscale(0%) opacity(1); }

  @media (max-width: 768px) {
    .brand-logo { height: 26px; }
    .marquee-track { gap: 3rem; animation-duration: 20s; }
    .fade-left, .fade-right { width: 60px; }
  }
</style>
</head>
<body>

<section class="brands">
  <div class="brands-header">
    <p class="eyebrow">Products We Use</p>
    <p>We use only premium, clinically proven brands trusted by medical professionals worldwide.</p>
  </div>
  <div class="fade-left"></div>
  <div class="fade-right"></div>
  <div class="marquee-outer">
    <div class="marquee-track">
      <!-- First set -->
      <img class="brand-logo" src="https://static.wixstatic.com/media/0b63bc_de10604e4c624c4c9c679ba1c8b2fbab~mv2.png" alt="Juvéderm dermal filler used at Dr Smith Aesthetics London" title="Juvéderm – Premium Dermal Filler" />
      <img class="brand-logo" src="https://static.wixstatic.com/media/0b63bc_fb6ca35c908d43bcb028effd972f41f7~mv2.png" alt="Skinvive by Juvéderm skin booster used at Dr Smith Aesthetics London" title="Skinvive by Juvéderm – Injectable Skin Booster" />
      <img class="brand-logo brand-logo-invert" src="https://static.wixstatic.com/media/0b63bc_1d1c015ae27e4255bb3816ffc5c0ec23~mv2.png" alt="Teoxane anti-wrinkle injectable brand used at Dr Smith Aesthetics London" title="Teoxane – Premium Anti-Wrinkle Injectable" />
      <img class="brand-logo" src="https://static.wixstatic.com/media/0b63bc_f0bcea0f35c64908bf5e7cd6fb17ffa1~mv2.png" alt="Dermapen 4 professional microneedling device used at Dr Smith Aesthetics London" title="Dermapen 4 – Medical Grade Microneedling Device" />
      <img class="brand-logo" src="https://static.wixstatic.com/media/0b63bc_ad33cfe781f34bb58c2f02acd5c07b44~mv2.png" alt="Plinest polynucleotides by Mastelli used at Dr Smith Aesthetics London" title="Plinest by Mastelli – Polynucleotide Skin Regeneration" />
      <img class="brand-logo" src="https://static.wixstatic.com/media/0b63bc_970e90bfdc8a4cd4bc708ebb291f71a5~mv2.png" alt="Sunekos amino acid and hyaluronic acid skin treatment used at Dr Smith Aesthetics London" title="Sunekos – Advanced Skin Regeneration Treatment" />
      <!-- Duplicate for seamless loop -->
      <img class="brand-logo" src="https://static.wixstatic.com/media/0b63bc_de10604e4c624c4c9c679ba1c8b2fbab~mv2.png" alt="Juvéderm dermal filler used at Dr Smith Aesthetics London" title="Juvéderm – Premium Dermal Filler" />
      <img class="brand-logo" src="https://static.wixstatic.com/media/0b63bc_fb6ca35c908d43bcb028effd972f41f7~mv2.png" alt="Skinvive by Juvéderm skin booster used at Dr Smith Aesthetics London" title="Skinvive by Juvéderm – Injectable Skin Booster" />
      <img class="brand-logo brand-logo-invert" src="https://static.wixstatic.com/media/0b63bc_1d1c015ae27e4255bb3816ffc5c0ec23~mv2.png" alt="Teoxane anti-wrinkle injectable brand used at Dr Smith Aesthetics London" title="Teoxane – Premium Anti-Wrinkle Injectable" />
      <img class="brand-logo" src="https://static.wixstatic.com/media/0b63bc_f0bcea0f35c64908bf5e7cd6fb17ffa1~mv2.png" alt="Dermapen 4 professional microneedling device used at Dr Smith Aesthetics London" title="Dermapen 4 – Medical Grade Microneedling Device" />
      <img class="brand-logo" src="https://static.wixstatic.com/media/0b63bc_ad33cfe781f34bb58c2f02acd5c07b44~mv2.png" alt="Plinest polynucleotides by Mastelli used at Dr Smith Aesthetics London" title="Plinest by Mastelli – Polynucleotide Skin Regeneration" />
      <img class="brand-logo" src="https://static.wixstatic.com/media/0b63bc_970e90bfdc8a4cd4bc708ebb291f71a5~mv2.png" alt="Sunekos amino acid and hyaluronic acid skin treatment used at Dr Smith Aesthetics London" title="Sunekos – Advanced Skin Regeneration Treatment" />
    </div>
  </div>
</section>

<script>
function notifyHeight() {
  setTimeout(() => {
    window.parent.postMessage({ type: 'iframeHeight', height: document.body.scrollHeight }, '*');
  }, 50);
}
window.addEventListener('load', notifyHeight);
</script>
</body>
</html>
