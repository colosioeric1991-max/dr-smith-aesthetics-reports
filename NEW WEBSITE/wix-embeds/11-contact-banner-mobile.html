<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
<style>
  :root {
    --teal:       #0D3B4F;
    --teal-mid:   #1A5068;
    --gold:       #C9A96E;
    --warm-white: #FDFAF6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; overflow-x: hidden; }
  body { font-family: 'DM Sans', sans-serif; background: var(--teal); }

  .banner {
    padding: 3rem 2rem 3.5rem;
    background: var(--teal);
    position: relative;
    overflow: hidden;
  }
  .banner::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 80% 20%, rgba(201,169,110,0.07) 0%, transparent 65%);
    pointer-events: none;
  }

  .eyebrow {
    font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--gold);
    display: flex; align-items: center; gap: 0.7rem;
    margin-bottom: 1rem;
  }
  .eyebrow::before { content: ''; width: 26px; height: 1px; background: var(--gold); }

  .heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.4rem, 9vw, 3.2rem);
    font-weight: 300; line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--warm-white);
    margin-bottom: 1.25rem;
  }
  .heading em { font-style: italic; font-weight: 400; }

  .blurb {
    font-size: 0.88rem; line-height: 1.8; font-weight: 300;
    color: rgba(253,250,246,0.65);
    margin-bottom: 2rem;
  }

  .contact-detail {
    display: flex; align-items: center; gap: 0.75rem;
    font-size: 0.88rem; font-weight: 300;
    color: rgba(253,250,246,0.75);
    margin-bottom: 1.1rem;
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .contact-detail:last-of-type { margin-bottom: 0; }
  .contact-detail:hover { color: var(--gold); }
  .contact-detail svg { color: var(--gold); flex-shrink: 0; }
</style>
</head>
<body>
  <div class="banner">
    <p class="eyebrow">Get In Touch</p>
    <h2 class="heading">Send Us a <em>Message</em></h2>
    <p class="blurb">Have a question about a treatment or want to book a consultation? We'd love to hear from you. We'll get back to you as soon as possible.</p>

    <a href="mailto:info@lsmithaesthetics.com" class="contact-detail">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
      info@lsmithaesthetics.com
    </a>

    <a href="https://wa.me/447835959075" target="_blank" onclick="window.top.open(this.href,'_blank');return false;" class="contact-detail">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      +44 7835 959075
    </a>

    <a href="https://maps.google.com/?q=Ink+Beauty+Skin+Clinic,+341+Kennington+Road,+London+SE11+4QE" target="_blank" onclick="window.top.open(this.href,'_blank');return false;" class="contact-detail" style="align-items:flex-start; margin-top:0.75rem;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-top:0.15rem;"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>Ink Beauty Skin Clinic<br/>341 Kennington Road<br/>London, SE11 4QE</span>
    </a>
  </div>

<script>
function notifyHeight() {
  setTimeout(() => {
    window.parent.postMessage({ type: 'iframeHeight', height: document.body.scrollHeight }, '*');
  }, 50);
}
window.addEventListener('load', notifyHeight);
</script>
</body>
</html>
