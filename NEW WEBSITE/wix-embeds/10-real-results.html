<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
<style>
  :root {
    --teal:       #0D3B4F;
    --teal-mid:   #1A5068;
    --gold:       #C9A96E;
    --cream:      #F5F1EB;
    --warm-white: #FDFAF6;
    --muted:      #6B7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; overflow-x: hidden; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); }

  .results {
    background: var(--cream);
    padding: 3.5rem 5.5rem;
    position: relative;
  }
  .results::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(201,169,110,0.4), transparent);
  }

  .eyebrow {
    font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--gold);
    display: flex; align-items: center; gap: 0.7rem;
    margin-bottom: 0.9rem;
  }
  .eyebrow::before { content: ''; width: 26px; height: 1px; background: var(--gold); }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.8rem, 2.4vw, 2.6rem);
    font-weight: 300; line-height: 1.1;
    letter-spacing: -0.02em; color: var(--teal);
    margin-bottom: 1.75rem;
  }
  .section-title em { font-style: italic; font-weight: 400; }

  /* ── SLIDESHOW ── */
  .slideshow {
    position: relative;
    width: 100%;
    max-width: 260px;
    margin: 0 auto;
    user-select: none;
  }

  .slides-track {
    position: relative;
    width: 100%;
    aspect-ratio: 2/3;
    max-width: 260px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 4px;
    background: rgba(13,59,79,0.06);
  }

  .slide {
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity 0.55s ease;
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    pointer-events: auto;
  }

  .slide img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }

  /* Gold line overlay at bottom edge */
  .slides-track::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    z-index: 2;
    pointer-events: none;
  }

  /* ── ARROWS ── */
  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    z-index: 10;
    background: rgba(253,250,246,0.92);
    border: 1px solid rgba(201,169,110,0.35);
    color: var(--teal);
    width: 2.8rem; height: 2.8rem;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
    font-size: 1rem;
    box-shadow: 0 4px 16px rgba(13,59,79,0.12);
  }
  .arrow:hover {
    background: var(--teal);
    border-color: var(--teal);
    color: var(--gold);
    transform: translateY(-50%) scale(1.08);
  }
  .arrow-prev { left: -1.4rem; }
  .arrow-next { right: -1.4rem; }

  /* ── DOTS ── */
  .dots {
    display: flex; justify-content: center; align-items: center;
    gap: 0.55rem; margin-top: 1.1rem;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(13,59,79,0.2);
    cursor: pointer;
    transition: background 0.25s ease, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    border: none; padding: 0;
  }
  .dot.active {
    background: var(--gold);
    transform: scale(1.4);
  }

  /* ── COUNTER ── */
  .counter {
    text-align: center; margin-top: 1rem;
    font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); font-weight: 400;
  }

  .results-note {
    margin-top: 2rem;
    font-size: 0.78rem; font-weight: 300;
    color: var(--muted); font-style: italic;
    text-align: center;
  }

  @media (max-width: 900px) {
    .results { padding: 4rem 1.5rem; }
    .arrow-prev { left: -0.8rem; }
    .arrow-next { right: -0.8rem; }
  }

  @media (max-width: 480px) {
    .results { padding: 3rem 1rem; }
    .arrow { width: 2.2rem; height: 2.2rem; font-size: 0.85rem; }
    .arrow-prev { left: -0.5rem; }
    .arrow-next { right: -0.5rem; }
  }
</style>
</head>
<body>
  <section class="results">
    <p class="eyebrow">Real Results</p>
    <h2 class="section-title">Client <em>Transformations</em></h2>

    <div class="slideshow">
      <div class="slides-track" id="slidesTrack">
        <!-- Slides are injected by JS from the IMAGES array below -->
      </div>
      <button class="arrow arrow-prev" id="prevBtn" aria-label="Previous">&#8592;</button>
      <button class="arrow arrow-next" id="nextBtn" aria-label="Next">&#8594;</button>
    </div>

    <div class="dots" id="dots"></div>
    <p class="counter" id="counter"></p>
    <p class="results-note">Individual results may vary. All treatments performed by Dr Smith, MBBS BSc (Hons).</p>
  </section>

<script>
// ─────────────────────────────────────────────
// ADD YOUR IMAGES HERE
// Paste Wix Media Manager URLs into this array.
// Each item is just an image URL (string).
// ─────────────────────────────────────────────
const IMAGES = [
  { src: 'https://static.wixstatic.com/media/0b63bc_7b2198d28f0e4848a388f5bde01a4cab~mv2.png', alt: 'Tear trough filler before and after results by Dr Smith Aesthetics, Kennington South London', title: 'Tear Trough Filler Results – Dr Smith Aesthetics London' },
  { src: 'https://static.wixstatic.com/media/0b63bc_eb59111b846c45839a0a21f7d6ae4c4f~mv2.png', alt: 'Lip filler before and after results by Dr Smith Aesthetics, South London', title: 'Lip Filler Results – Dr Smith Aesthetics London' },
  { src: 'https://static.wixstatic.com/media/0b63bc_aa97e08db95e4c51874b96ed2c1c929c~mv2.png', alt: 'Lip filler treatment before and after by Dr Smith Aesthetics, Kennington London', title: 'Lip Filler Before and After – Dr Smith Aesthetics Kennington' },
  { src: 'https://static.wixstatic.com/media/0b63bc_f12b9891d5464c91901b2992975723da~mv2.png', alt: 'Chin filler before and after results by Dr Smith Aesthetics, South London', title: 'Chin Filler Results – Dr Smith Aesthetics London' },
  { src: 'https://static.wixstatic.com/media/0b63bc_b6830e52945342c2a8d6c729e695b11d~mv2.png', alt: 'Lip filler natural results before and after by Dr Lee Smith, GMC registered doctor South London', title: 'Lip Filler Natural Results – Dr Lee Smith Aesthetics' },
  { src: 'https://static.wixstatic.com/media/0b63bc_2d002691b001483aab66d946ccb13d25~mv2.png', alt: 'Lip filler before and after results at Ink Beauty Skin Clinic, Kennington South London', title: 'Lip Filler Results – Ink Beauty Skin Clinic London' },
  { src: 'https://static.wixstatic.com/media/0b63bc_b017fcbdad3f4d279941df1c21403f4a~mv2.png', alt: 'Tear trough filler before and after results by Dr Smith Aesthetics, South London', title: 'Tear Trough Filler Before and After – Dr Smith Aesthetics' },
  { src: 'https://static.wixstatic.com/media/0b63bc_1d5be256da59437caea09e4532ee8e0b~mv2.png', alt: 'Lip filler results before and after at Dr Smith Aesthetics, Kennington South London', title: 'Lip Filler Results – Dr Smith Aesthetics South London' },
  { src: 'https://static.wixstatic.com/media/0b63bc_496735a5ab2341768ea95db9cb53018c~mv2.png', alt: 'Lip filler before and after by Dr Lee Smith, medical aesthetic doctor Kennington London', title: 'Lip Filler Before and After – Dr Lee Smith Aesthetics' },
];
// NOTE: When deploying to Wix, replace these paths with
// your Wix Media Manager URLs for each image.
// ─────────────────────────────────────────────

let current = 0;
let autoTimer = null;
const AUTO_DELAY = 4500; // ms between auto-advances

const track   = document.getElementById('slidesTrack');
const dotsEl  = document.getElementById('dots');
const counter = document.getElementById('counter');

// Build slides
IMAGES.forEach((item, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide' + (i === 0 ? ' active' : '');
  const img = document.createElement('img');
  img.src = item.src;
  img.alt = item.alt;
  img.title = item.title;
  img.draggable = false;
  slide.appendChild(img);
  track.appendChild(slide);
});

// Build dots
IMAGES.forEach((_item, i) => {
  const dot = document.createElement('button');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
  dot.addEventListener('click', () => { goTo(i); resetAuto(); });
  dotsEl.appendChild(dot);
});

function updateUI() {
  document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === current));
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
  counter.textContent = (current + 1) + ' / ' + IMAGES.length;
  notifyHeight();
}

function goTo(n) {
  current = (n + IMAGES.length) % IMAGES.length;
  updateUI();
}

function startAuto() {
  autoTimer = setInterval(() => goTo(current + 1), AUTO_DELAY);
}
function resetAuto() {
  clearInterval(autoTimer);
  startAuto();
}

document.getElementById('prevBtn').addEventListener('click', () => { goTo(current - 1); resetAuto(); });
document.getElementById('nextBtn').addEventListener('click', () => { goTo(current + 1); resetAuto(); });

// Touch / swipe support
let touchStartX = 0;
track.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
track.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 40) { goTo(current + (dx < 0 ? 1 : -1)); resetAuto(); }
});

// Keyboard support
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  { goTo(current - 1); resetAuto(); }
  if (e.key === 'ArrowRight') { goTo(current + 1); resetAuto(); }
});

// Init
updateUI();
startAuto();

function notifyHeight() {
  setTimeout(() => {
    window.parent.postMessage({ type: 'iframeHeight', height: document.body.scrollHeight }, '*');
  }, 50);
}
window.addEventListener('load', notifyHeight);
</script>
</body>
</html>
