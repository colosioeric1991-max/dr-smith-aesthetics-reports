<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hero Preview — Dr Smith Aesthetics</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
<style>
  :root {
    --teal:   #0D3B4F;
    --gold:   #C9A96E;
    --cream:  #F5F1EB;
    --warm:   #FDFAF6;
    --muted:  #6B7280;
    --blue-accent: #4A8FA8;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; min-height: 100vh; font-family: 'DM Sans', sans-serif; }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    background: var(--warm);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 24px;
  }

  .hero-inner {
    max-width: 680px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* eyebrow */
  .eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 2rem;
  }
  .eyebrow::before,
  .eyebrow::after {
    content: '';
    display: block;
    width: 32px;
    height: 1px;
    background: var(--gold);
    flex-shrink: 0;
  }

  /* headline */
  .headline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(3.8rem, 8vw, 5.6rem);
    line-height: 1.05;
    letter-spacing: -0.025em;
    color: var(--teal);
    margin-bottom: 0.15em;
  }
  .headline-italic {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(3.8rem, 8vw, 5.6rem);
    line-height: 1.05;
    letter-spacing: -0.025em;
    color: var(--blue-accent);
    display: block;
    margin-bottom: 2.2rem;
  }

  /* body copy */
  .body-copy {
    font-size: 1.0rem;
    font-weight: 300;
    line-height: 1.7;
    color: var(--muted);
    max-width: 520px;
    margin-bottom: 2.8rem;
  }

  /* CTAs */
  .cta-group {
    display: flex;
    align-items: center;
    gap: 2.2rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--warm);
    background: var(--teal);
    padding: 1rem 2.4rem;
    border-radius: 2px;
    text-decoration: none;
    border: 1.5px solid var(--teal);
    transition: background 0.25s ease, color 0.25s ease, transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }
  .btn-primary:hover { background: transparent; color: var(--teal); transform: translateY(-2px); }

  .btn-scroll {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--teal);
    text-decoration: none;
    opacity: 0.75;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .btn-scroll:hover { opacity: 1; transform: translateY(2px); }
</style>
</head>
<body>

<section class="hero">
  <div class="hero-inner">

    <div class="eyebrow">Medical Aesthetics &middot; South London</div>

    <h1 class="headline">Your Confidence,</h1>
    <span class="headline-italic">Our Priority</span>

    <p class="body-copy">
      Experienced medical doctor providing personalised aesthetic treatments in London.
      Science-led approach for naturally beautiful results, every time.
    </p>

    <div class="cta-group">
      <a href="#" class="btn-primary">Book Now &nbsp;&rarr;</a>
      <a href="#" class="btn-scroll">Scroll to explore more &nbsp;&darr;</a>
    </div>

  </div>
</section>

</body>
</html>
