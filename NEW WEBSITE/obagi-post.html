<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #0D3B4F; }

  .post {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    font-family: "DM Sans", sans-serif;
  }

  /* Full bleed photo */
  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 10%;
  }

  /* Layered overlays */
  .overlay-top {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
      rgba(13,59,79,0.15) 0%,
      rgba(13,59,79,0.05) 35%,
      transparent 55%
    );
    pointer-events: none;
  }

  .overlay-bottom {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top,
      rgba(13,59,79,0.98) 0%,
      rgba(13,59,79,0.92) 30%,
      rgba(13,59,79,0.6) 50%,
      rgba(13,59,79,0.1) 70%,
      transparent 85%
    );
    pointer-events: none;
  }

  /* Gold radial glow */
  .glow {
    position: absolute;
    bottom: -10%;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    height: 60%;
    background: radial-gradient(ellipse at center bottom, rgba(201,169,110,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Content */
  .content {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 0 72px 72px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }
  .eyebrow-line {
    width: 36px;
    height: 1px;
    background: #C9A96E;
    flex-shrink: 0;
  }
  .eyebrow-text {
    font-family: "DM Sans", sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #C9A96E;
  }

  .heading {
    font-family: "Cormorant Garamond", serif;
    font-size: 68px;
    font-weight: 300;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: #FDFAF6;
    margin-bottom: 28px;
  }
  .heading em {
    font-style: italic;
    font-weight: 400;
    color: #e8d4b0;
  }

  .divider {
    width: 48px;
    height: 1px;
    background: linear-gradient(to right, rgba(201,169,110,0.8), transparent);
    margin-bottom: 24px;
  }

  .subtext {
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.06em;
    color: rgba(253,250,246,0.6);
    text-transform: uppercase;
  }

  /* Top logo area */
  .top-bar {
    position: absolute;
    top: 52px;
    left: 72px;
    right: 72px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .clinic-name {
    font-family: "Cormorant Garamond", serif;
    font-size: 16px;
    font-style: italic;
    font-weight: 400;
    color: rgba(253,250,246,0.75);
    letter-spacing: 0.04em;
  }

  .badge {
    background: rgba(201,169,110,0.15);
    border: 1px solid rgba(201,169,110,0.4);
    border-radius: 2px;
    padding: 8px 16px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #C9A96E;
  }

  .obagi-logo-chip {
    opacity: 0.85;
    background: rgba(253,250,246,0.72);
    border: 1px solid rgba(201,169,110,0.3);
    border-radius: 2px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    backdrop-filter: blur(8px);
  }
  .obagi-logo {
    height: 72px;
    width: auto;
    display: block;
  }
</style>
</head>
