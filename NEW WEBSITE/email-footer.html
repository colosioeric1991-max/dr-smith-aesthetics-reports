<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ffffff; font-family: 'DM Sans', sans-serif; }
  .footer {
    width: 600px;
    background: #ffffff;
    padding: 48px 40px;
    display: flex;
    align-items: center;
    gap: 0;
  }
  .col {
    flex: 1;
    padding: 0 20px;
    min-width: 0;
  }
  .col:first-child { padding-left: 0; flex: 1.3; }
  .col:last-child  { padding-right: 0; flex: 1.3; }
  .divider {
    width: 1px;
    height: 60px;
    background: #0D3B4F;
    opacity: 0.25;
    flex-shrink: 0;
  }
  .label {
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #C9A96E;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .detail {
    font-size: 0.82rem;
    line-height: 1.75;
    color: #0D3B4F;
    font-weight: 300;
  }
  .site-link {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    font-style: italic;
    font-weight: 400;
    color: #0D3B4F;
    text-align: right;
    display: block;
  }
  .col-right { text-align: right; }
</style>
</head>
<body>
<div class="footer">
  <div class="col">
    <p class="label">Find Us</p>
    <p class="detail">Ink Beauty Skin Clinic<br>341 Kennington Road<br>London, SE11 4QE</p>
  </div>
  <div class="divider"></div>
  <div class="col col-right">
    <p class="label">Phone</p>
    <p class="detail">+44 7835 959075</p>
  </div>
  <div class="divider"></div>
  <div class="col col-right">
    <p class="label">Get In Touch</p>
    <p class="detail">info@lsmithaesthetics.com<br>www.lsmithaesthetics.com</p>
  </div>
</div>
</body>
</html>
