<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
<style>
  :root {
    --teal: #0D3B4F;
    --teal-mid: #1A5068;
    --warm-white: #FDFAF6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: 'DM Sans', sans-serif; background: var(--warm-white); }

  .obagi-banner {
    display: grid;
    grid-template-columns: 1fr 1.2fr 1fr;
    height: 100%;
    min-height: 420px;
    background: #F5F1EB;
    border-top: 1px solid rgba(13,59,79,0.08);
    border-bottom: 1px solid rgba(13,59,79,0.08);
    overflow: hidden;
  }

  .obagi-img-left,
  .obagi-img-right {
    position: relative;
    overflow: hidden;
  }

  .obagi-img-left img,
  .obagi-img-right img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .obagi-img-left img {
    object-position: center 30%;
  }

  .obagi-img-right img {
    object-position: center center;
  }

  .obagi-centre {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    text-align: center;
    padding: 2rem 2rem 3rem;
    gap: 0.5rem;
  }

  .obagi-logo-img {
    width: 85%;
    max-width: 340px;
    height: auto;
    display: block;
    mix-blend-mode: multiply;
  }

  .obagi-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    font-style: italic;
    color: var(--teal);
    margin-top: 0.2rem;
  }

  .obagi-sub {
    font-size: 0.82rem;
    color: rgba(13,59,79,0.65);
    line-height: 1.6;
    max-width: 260px;
  }

  .obagi-ctas {
    display: flex;
    gap: 0.75rem;
    margin-top: 0.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .obagi-btn-primary {
    background: var(--teal);
    color: var(--warm-white);
    padding: 0.6rem 1.4rem;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1.5px solid var(--teal);
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: background 0.2s, color 0.2s, transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }
  .obagi-btn-primary:hover { background: transparent; color: var(--teal); transform: translateY(-2px); }

  .obagi-btn-secondary {
    background: transparent;
    color: var(--teal);
    padding: 0.6rem 1.4rem;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1.5px solid var(--teal);
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: background 0.2s, color 0.2s, transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }
  .obagi-btn-secondary:hover { background: var(--teal); color: var(--warm-white); transform: translateY(-2px); }

  @media (max-width: 700px) {
    .obagi-banner { grid-template-columns: 1fr; position: relative; }
    .obagi-img-left { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
    .obagi-img-left img { opacity: 0.18; object-position: center 20%; }
    .obagi-img-right { display: none; }
    .obagi-centre { position: relative; z-index: 1; padding: 2rem 1.5rem; }
  }
</style>
</head>
